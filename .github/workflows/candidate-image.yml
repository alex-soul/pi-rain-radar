name: Build release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed RC tag (never promotes latest)
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: candidate-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/alex-soul/pi-rain-radar
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Record tagged source
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate candidate version and test
        run: |
          node -e 'if (!/^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$/.test(process.env.RELEASE_TAG))process.exit(1)'
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          npm ci
          npm test
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Verify fresh startup and persistent data on both architectures
        run: |
          bash scripts/smoke-image.sh "$IMAGE:$RELEASE_TAG" linux/amd64
          bash scripts/smoke-image.sh "$IMAGE:$RELEASE_TAG" linux/arm64
