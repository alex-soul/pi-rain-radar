<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grass Lab · Pi Rain Radar</title><link rel="stylesheet" href="/__grass-lab.css"><link rel="stylesheet" href="/grass-access.css"><script type="module" src="/__grass-lab.js"></script></head>
<body>
<header class="topbar"><a href="/__grass-observe" class="primary add-link">Add Observation</a><nav aria-label="Lab actions"><a class="outline-button" href="/">Radar</a><button id="theme" aria-label="Switch colour theme">Light / dark</button><button id="refresh">Refresh</button><button id="export">Export</button></nav></header>
<main>
<div class="lab-layout">
<section class="analysis" aria-label="Grass analysis">
<section class="card chart-card">
<div class="section-heading chart-heading"><div class="window-heading"><div class="periods" role="group" aria-label="Window presets"><button data-hours="24" aria-pressed="false">24h</button><button data-hours="72" aria-pressed="false">3 days</button><button data-hours="168" aria-pressed="true">7 days</button></div><button id="latest" class="text-button">Latest</button></div><span id="window-label" aria-label="Visible date and time range"></span><time id="cursor-time" class="chart-time" aria-label="Cursor time">—</time></div>
<div class="chart-wrap"><svg id="chart" tabindex="0" viewBox="0 0 960 340" role="group" aria-label="Grass wetness chart. Drag horizontally to pan, hover or tap to inspect. Arrow keys inspect; Shift and arrow keys pan."></svg><div id="chart-tooltip" class="chart-tooltip" role="tooltip" hidden><div id="tooltip-content"></div><div class="chart-tooltip-meta"><time id="tooltip-time"></time><span id="tooltip-intensity"></span></div></div></div>
<div class="navigator"><div id="timeline" class="timeline" aria-label="Retained history">
<svg id="timeline-preview" aria-hidden="true" preserveAspectRatio="none"></svg>
<button id="timeline-selection" class="timeline-selection" aria-label="Move visible time window"></button>
<button id="timeline-start" class="timeline-handle" data-edge="start" role="slider" aria-label="Visible window start"></button>
<button id="timeline-end" class="timeline-handle" data-edge="end" role="slider" aria-label="Visible window end"></button>
</div></div>
<div class="inspection"><div><span>Recorded</span><strong id="inspect-recorded">—</strong></div><div><span>Alternative</span><strong id="inspect-candidate" class="accent">—</strong></div><div><span>Temperature</span><strong id="inspect-temperature">—</strong></div><div><span>Dew</span><strong id="inspect-dew">—</strong></div><div><span>Wind</span><strong id="inspect-wind">—</strong></div><div><span>Sun</span><strong id="inspect-solar">—</strong></div></div>
<section class="effects" aria-label="Wetting and drying contributions">
<div id="effect-strips" class="effect-strips"><div id="effect-cursor" aria-hidden="true"></div></div>
<p id="effect-inspection" class="effect-inspection" aria-live="off">Select a factor to inspect its contribution.</p>
</section>

</section>
<section class="card observations"><div class="section-heading"><h2>Grass observations</h2><span id="observation-count" class="count"></span></div><div class="table-wrap"><table><thead><tr><th>Observed</th><th>Intensity</th><th>Recorded</th><th>Alternative</th><th>Note</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="observations"></tbody></table></div></section>
</section>
<aside class="controls">
<section class="card tuning"><div id="sliders"></div><div class="tuning-actions"><button id="reset" type="button" class="outline-button">Reset</button><button id="apply" type="button" class="primary">Apply</button></div></section>
<p id="apply-message" role="status"></p>
</aside></div>
<p id="error" role="alert" hidden></p>
</main>
<dialog id="edit-observation" class="observation-dialog" aria-labelledby="edit-title">
<form id="edit-form"><div class="section-heading"><h2 id="edit-title">Edit observation</h2><button type="button" id="edit-close" class="text-button" aria-label="Close edit observation">×</button></div>
<fieldset><legend>Intensity</legend><div id="edit-grades" class="grades"></div></fieldset>
<label class="field">Observation time<input type="datetime-local" id="edit-time" required></label>
<label class="field">Note <span>optional</span><input id="edit-note" maxlength="500"></label>
<p id="edit-message" role="status"></p>
<div id="delete-confirm" hidden><p>Delete this observation?</p><div class="dialog-actions"><button type="button" id="keep-observation">Keep</button><button type="button" id="confirm-delete" class="danger">Delete observation</button></div></div>
<div class="dialog-actions" id="edit-actions"><button type="button" id="delete-observation" class="text-button danger">Delete</button><button type="button" id="cancel-edit">Cancel</button><button type="submit" id="save-edit" class="primary">Save</button></div>
</form></dialog></body></html>
